name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute (if wrapper present)
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Summary
        run: |
          echo "### Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: **crypto-app-debug**" >> $GITHUB_STEP_SUMMARY
          echo "Download from this run's Artifacts section." >> $GITHUB_STEP_SUMMARY
          ls -la app/build/outputs/apk/debug/ || true
